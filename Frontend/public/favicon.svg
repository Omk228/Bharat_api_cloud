<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>
    <linearGradient id="saffron" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fb923c" />
      <stop offset="100%" stop-color="#ea580c" />
    </linearGradient>
    <linearGradient id="cyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
    <linearGradient id="green" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4ade80" />
      <stop offset="100%" stop-color="#16a34a" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Squircle -->
  <rect x="6" y="6" width="88" height="88" rx="22" fill="url(#bg)" stroke="#38bdf8" stroke-width="2.5" stroke-opacity="0.4" />

  <!-- Connecting API Data Grid -->
  <path d="M 28 50 L 72 50" stroke="url(#cyan)" stroke-width="4.5" stroke-linecap="round" />
  <path d="M 50 28 L 50 72" stroke="url(#cyan)" stroke-width="4.5" stroke-linecap="round" />

  <!-- Saffron Top Accent Node -->
  <circle cx="50" cy="28" r="8.5" fill="url(#saffron)" stroke="#ffffff" stroke-width="2.5" filter="url(#glow)" />

  <!-- Left Saffron Node -->
  <circle cx="28" cy="50" r="7.5" fill="url(#cyan)" stroke="#ffffff" stroke-width="2" />

  <!-- Right Green Node -->
  <circle cx="72" cy="50" r="7.5" fill="url(#green)" stroke="#ffffff" stroke-width="2" />

  <!-- Bottom Green Node -->
  <circle cx="50" cy="72" r="8.5" fill="url(#green)" stroke="#ffffff" stroke-width="2.5" filter="url(#glow)" />

  <!-- Central Cloud Hub Node -->
  <circle cx="50" cy="50" r="12" fill="#0f172a" stroke="url(#cyan)" stroke-width="3.5" />
  <circle cx="50" cy="50" r="5" fill="#38bdf8" />
</svg>
